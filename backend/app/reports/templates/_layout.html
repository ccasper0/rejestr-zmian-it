<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %} {{ number }}</title>
<style>
/* Fonts bundled with the application (OFL) - never system fonts (CLAUDE.md §9). */
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-style: normal; src: url("IBMPlexSans-Regular.woff") format("woff"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-style: italic; src: url("IBMPlexSans-Italic.woff") format("woff"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-style: normal; src: url("IBMPlexSans-Medium.woff") format("woff"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-style: normal; src: url("IBMPlexSans-SemiBold.woff") format("woff"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 700; font-style: normal; src: url("IBMPlexSans-Bold.woff") format("woff"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-style: normal; src: url("IBMPlexMono-Regular.woff") format("woff"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-style: normal; src: url("IBMPlexMono-Medium.woff") format("woff"); }

@page {
  size: A4;
  margin: 15mm;
  @top-left {
    content: "Rejestr zmian IT — {% block running_title %}{% endblock %}";
    font-family: "IBM Plex Sans"; font-size: 7.5pt; color: #5A6270;
    vertical-align: bottom; padding-bottom: 2mm;
  }
  @top-right {
    content: "{{ number }}";
    font-family: "IBM Plex Mono"; font-size: 7.5pt; color: #5A6270;
    vertical-align: bottom; padding-bottom: 2mm;
  }
  @bottom-left {
    content: "Raport {{ number }} · sha256 danych: {{ data_sha256 }}";
    font-family: "IBM Plex Mono"; font-size: 6.5pt; color: #5A6270;
    vertical-align: top; padding-top: 2mm;
  }
  @bottom-right {
    content: "Strona " counter(page) " z " counter(pages);
    font-family: "IBM Plex Sans"; font-size: 7.5pt; color: #5A6270;
    vertical-align: top; padding-top: 2mm;
  }
}

html { font-family: "IBM Plex Sans"; font-size: 8.5pt; color: #161A1F; line-height: 1.35; }
body { margin: 0; }
h1 { font-size: 16pt; font-weight: 600; margin: 0 0 2mm 0; }
h2 { font-size: 11.5pt; font-weight: 600; margin: 6mm 0 2.5mm 0; padding-bottom: 1mm;
     border-bottom: 0.6pt solid #DDE1E6; break-after: avoid; }
h3 { font-size: 9.5pt; font-weight: 600; margin: 4mm 0 1.5mm 0; break-after: avoid; }
p { margin: 0 0 1.5mm 0; }
.mono, .id, code { font-family: "IBM Plex Mono"; }
.muted { color: #5A6270; }
.small { font-size: 7.5pt; }
.hash { font-family: "IBM Plex Mono"; font-size: 6.8pt; word-break: break-all; }
.pre { white-space: pre-wrap; }

table { width: 100%; border-collapse: collapse; margin: 0 0 2mm 0; }
th { text-align: left; font-weight: 600; font-size: 7.5pt; color: #5A6270;
     border-bottom: 0.8pt solid #DDE1E6; padding: 1.2mm 1.5mm; vertical-align: bottom; }
td { border-bottom: 0.4pt solid #DDE1E6; padding: 1.2mm 1.5mm; vertical-align: top; }
thead { display: table-header-group; }
tr { break-inside: avoid; }
td.num, th.num { text-align: right; }
table.register { table-layout: fixed; font-size: 7.3pt; }
table.register td, table.register th { padding: 1mm 1mm; overflow-wrap: break-word; }
table.register .pill { font-size: 6.6pt; padding: 0.2mm 1.2mm; }

.meta { width: 100%; margin: 0 0 3mm 0; }
.meta td { border: none; padding: 0.6mm 2mm 0.6mm 0; }
.meta td.k { color: #5A6270; width: 38mm; }

.tiles { display: flex; gap: 3mm; margin: 2mm 0 2mm 0; }
.tile { flex: 1; border: 0.6pt solid #DDE1E6; border-radius: 2.5mm; padding: 2.5mm 3mm; }
.tile .v { font-size: 17pt; font-weight: 600; }
.tile .l { font-size: 7.5pt; color: #5A6270; }
.tile.alert { border-color: #8A1C1C; }

.pill { display: inline-block; border-radius: 3mm; padding: 0.2mm 2mm; font-size: 7.2pt;
        font-weight: 500; white-space: nowrap; }
.st-draft { background: #ECEEF1; color: #3D4450; }
.st-pending_approval { background: #FDF0D5; color: #7A4B00; }
.st-approved { background: #DCE7FD; color: #1E3A8A; }
.st-implemented { background: #E2F0FB; color: #0B4A6F; }
.st-verified { background: #DDF3E4; color: #14532D; }
.st-rejected, .st-rolled_back { background: #FBE1E1; color: #8A1C1C; }
.st-cancelled { background: #ECEEF1; color: #3D4450; }
.type-emergency { border: 0.8pt solid #8A1C1C; color: #8A1C1C; border-radius: 1.5mm;
                  padding: 0 1.2mm; white-space: nowrap; }

.ok { color: #14532D; font-weight: 600; }
.bad { color: #8A1C1C; font-weight: 600; }
.critical { border: 1.2pt solid #8A1C1C; background: #FBE1E1; border-radius: 2mm;
            padding: 2.5mm 3mm; margin: 1mm 0 2mm 0; }
.critical .title { color: #8A1C1C; font-weight: 700; }
.warning { border: 1pt solid #7A4B00; background: #FDF0D5; color: #7A4B00; border-radius: 2mm;
           padding: 2mm 3mm; margin: 1mm 0 2mm 0; }
.box { border: 0.6pt solid #DDE1E6; border-radius: 2mm; padding: 2.5mm 3mm; margin: 1mm 0 2mm 0; }

.diff td { border: none; padding: 0.3mm 1mm; font-size: 7.5pt; }
.diff .before { color: #8A1C1C; text-decoration: line-through; }
.diff .after { color: #14532D; }
.entry { border-bottom: 0.4pt solid #DDE1E6; padding: 1.5mm 0; break-inside: avoid; }
.entry .head { font-size: 7.5pt; }

.signatures { display: flex; gap: 10mm; margin-top: 8mm; break-inside: avoid; }
.signature { flex: 1; }
.signature .line { border-bottom: 0.6pt solid #161A1F; height: 18mm; }
.signature .cap { font-size: 7.5pt; color: #5A6270; padding-top: 1mm; }
.page-break { break-before: page; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
